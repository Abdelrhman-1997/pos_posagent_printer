name: Build POSAgent Windows x64

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: posagent-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 45

    steps:
      - name: Checkout build repository
        uses: actions/checkout@v4

      - name: Read pinned upstream revision
        id: source
        shell: pwsh
        run: |
          $commit = (Get-Content UPSTREAM_COMMIT -Raw).Trim()
          if ($commit -notmatch '^[0-9a-f]{40}$') {
            throw 'UPSTREAM_COMMIT must contain a full 40-character Git SHA.'
          }
          "commit=$commit" >> $env:GITHUB_OUTPUT

      - name: Fetch pinned POSAgent source
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force agent-src | Out-Null
          git -C agent-src init
          git -C agent-src remote add origin https://github.com/dieg0-a/posagentpro-src.git
          git -C agent-src fetch --depth 1 origin ${{ steps.source.outputs.commit }}
          git -C agent-src checkout --detach FETCH_HEAD
          $resolved = (git -C agent-src rev-parse HEAD).Trim()
          if ($resolved -ne '${{ steps.source.outputs.commit }}') {
            throw "Fetched revision mismatch: $resolved"
          }

      - name: Apply upstream Windows fixes
        shell: pwsh
        run: |
          $header = 'agent-src\messagesystem.h'
          $text = Get-Content $header -Raw
          $include = '#include "windowsprinter.h"'
          if ($text -notmatch [regex]::Escape($include)) {
            $needle = '#include "printer.hpp"'
            if ($text -notmatch [regex]::Escape($needle)) {
              throw 'Could not locate printer.hpp include in messagesystem.h.'
            }
            $text = $text.Replace($needle, "$needle`r`n$include")
            Set-Content -Path $header -Value $text -NoNewline -Encoding utf8
          }

          $resource = 'agent-src\posagent_resource.rc'
          $iconPath = (Resolve-Path 'agent-src\images\printagent_icon_big.ico').Path
          $escapedIconPath = $iconPath.Replace('\', '\\')
          $resourceText = Get-Content $resource -Raw
          $pattern = 'IDI_ICON1\s+ICON\s+"[^"]+"'
          $replacement = "IDI_ICON1`tICON`t`"$escapedIconPath`""
          $updated = [regex]::Replace($resourceText, $pattern, $replacement, 1)
          if ($updated -eq $resourceText) {
            throw 'Could not replace the hardcoded icon path.'
          }
          Set-Content -Path $resource -Value $updated -NoNewline -Encoding ascii

      - name: Integrate DSoft multi-printer sources
        shell: pwsh
        run: |
          & '.\scripts\apply-agent-overrides.ps1'

      - name: Install Qt 6.5.2 MSVC x64
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.5.2'
          arch: 'win64_msvc2019_64'
          dir: 'C:/'
          cache: true

      - name: Verify Visual Studio and Qt
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path $vswhere)) { throw 'vswhere.exe was not found.' }
          $vs = & $vswhere -latest -products * -requires Microsoft.Component.MSBuild -property installationPath
          if (-not $vs) { throw 'Visual Studio with MSBuild was not found.' }
          $qt = 'C:\Qt\6.5.2\msvc2019_64'
          if (-not (Test-Path (Join-Path $qt 'bin\windeployqt.exe'))) {
            throw "Qt was not installed at the required path: $qt"
          }

      - name: Configure CMake
        shell: pwsh
        run: |
          cmake -S agent-src -B build-win64 -G "Visual Studio 17 2022" -A x64 2>&1 |
            Tee-Object -FilePath configure.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build Release
        shell: pwsh
        run: |
          cmake --build build-win64 --config Release --parallel 2 2>&1 |
            Tee-Object -FilePath build.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Locate and verify executable
        id: locate
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path build-win64 -Recurse -Filter 'posagent.exe' | Select-Object -First 1
          if (-not $exe) { throw 'posagent.exe was not produced.' }
          $stream = [System.IO.File]::OpenRead($exe.FullName)
          try {
            $reader = [System.IO.BinaryReader]::new($stream)
            $stream.Position = 0x3c
            $peOffset = $reader.ReadInt32()
            $stream.Position = $peOffset + 4
            $machine = $reader.ReadUInt16()
          } finally {
            $stream.Dispose()
          }
          if ($machine -ne 0x8664) {
            throw ('Expected x64 PE machine 0x8664, got 0x{0:X4}' -f $machine)
          }
          "exe_path=$($exe.FullName)" >> $env:GITHUB_OUTPUT

      - name: Prepare runnable package
        id: package
        shell: pwsh
        run: |
          $packageDir = Join-Path $PWD 'package\posagent-win64-dev'
          New-Item -ItemType Directory -Force -Path $packageDir | Out-Null
          Copy-Item '${{ steps.locate.outputs.exe_path }}' (Join-Path $packageDir 'posagent-win64-dev.exe')
          "package_dir=$packageDir" >> $env:GITHUB_OUTPUT

      - name: Deploy Qt runtime
        shell: pwsh
        run: |
          $windeployqt = 'C:\Qt\6.5.2\msvc2019_64\bin\windeployqt.exe'
          $exe = Join-Path '${{ steps.package.outputs.package_dir }}' 'posagent-win64-dev.exe'
          & $windeployqt --release --compiler-runtime $exe 2>&1 | Tee-Object -FilePath windeployqt.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify packaged runtime
        shell: pwsh
        run: |
          $packageDir = '${{ steps.package.outputs.package_dir }}'
          $required = @('Qt6Core.dll','Qt6Gui.dll','Qt6Widgets.dll','Qt6PrintSupport.dll','platforms\qwindows.dll')
          $missing = @($required | Where-Object { -not (Test-Path (Join-Path $packageDir $_)) })
          if ($missing.Count -gt 0) { throw "Missing runtime files: $($missing -join ', ')" }

      - name: Bundle licenses
        shell: pwsh
        run: |
          $packageDir = '${{ steps.package.outputs.package_dir }}'
          Copy-Item 'agent-src\LICENSE' (Join-Path $packageDir 'LICENSE-posagent.txt')
          $noticeDir = Join-Path $packageDir 'THIRD-PARTY-NOTICES'
          New-Item -ItemType Directory -Force -Path $noticeDir | Out-Null
          'Qt 6.5.2 is dynamically linked. See https://www.qt.io/licensing/' |
            Out-File (Join-Path $noticeDir 'Qt-NOTICE.txt') -Encoding utf8

      - name: Smoke test package
        shell: pwsh
        continue-on-error: true
        run: |
          $exe = Join-Path '${{ steps.package.outputs.package_dir }}' 'posagent-win64-dev.exe'
          $process = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 5
          if (-not $process.HasExited) { Stop-Process -Id $process.Id -Force }

      - name: Create ZIP and checksums
        shell: pwsh
        run: |
          Compress-Archive -Path '${{ steps.package.outputs.package_dir }}\*' -DestinationPath 'posagent-win64-dev.zip' -Force
          $hash = (Get-FileHash -Algorithm SHA256 'posagent-win64-dev.zip').Hash
          "$hash  posagent-win64-dev.zip" | Out-File 'SHA256SUMS.txt' -Encoding ascii

      - name: Create build summary
        shell: pwsh
        run: |
          @"
          DSoft POS Printer Agent Windows build
          =====================================
          Upstream commit: ${{ steps.source.outputs.commit }}
          Runner: windows-2022
          Qt: 6.5.2 win64_msvc2019_64
          Included foundation:
          - persistent multi-printer profiles
          - legacy single-printer migration
          - backward-compatible printer_code request parsing
          Artifact: posagent-win64-dev.zip
          "@ | Out-File 'build-summary.txt' -Encoding utf8

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: posagent-win64-dev
          path: |
            posagent-win64-dev.zip
            SHA256SUMS.txt
            build-summary.txt
            configure.log
            build.log
            windeployqt.log
          if-no-files-found: error
          retention-days: 14
